name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  legacy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "2.7"
          - "3.6"
          - "3.7"
    steps:
      - uses: actions/checkout@v7
      - name: Run tests in legacy Python container
        run: docker run --rm -v "$PWD:/src" -w /src python:${{ matrix.python-version }} python test_ast.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python test_ast.py
